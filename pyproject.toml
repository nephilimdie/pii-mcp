[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pseudora-mcp"
version = "0.3.0"
description = "Remote MCP gateway for the Pseudora privacy API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.29,<2",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
pii-mcp = "pii_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
